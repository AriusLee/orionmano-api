# ─── 7. Multiples ───

- en: price to earnings ratio
  definition: Share price divided by earnings per share; standard equity multiple
  category: multiples
  do_not_translate: false
  zh_CN: { term: 市盈率, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 株価収益率, status: draft, reviewed_by: null, reviewed_on: null }

- en: P/E
  definition: Acronym for price-to-earnings multiple
  category: multiples
  do_not_translate: true

- en: EV/EBITDA
  definition: Enterprise value divided by EBITDA; capital-structure-neutral multiple
  category: multiples
  do_not_translate: true

- en: EV/Revenue
  definition: Enterprise value divided by revenue; used for high-growth or pre-profit companies
  category: multiples
  do_not_translate: true

- en: EV/Sales
