# Valuation-module-specific terms for the Orionmano Nasdaq-IPO advisory platform.
# Cross-cutting terms (SEC forms, EBITDA, EBIT, WACC, net debt, capex, D&A, NWC, LTM/TTM/NTM,
# CAGR, ARPU, churn, ROE/ROA/ROCE, FPI, S-1, F-1, IFRS, US GAAP, etc.) live in _shared.yaml.
# Do NOT duplicate those here. Schema mirrors _shared.yaml; see that file for full schema docs.
#
# Sections:
#   1. Fair value framework
#   2. DCF mechanics
#   3. Cost of capital
#   4. Capital structure
#   5. Comparable companies
#   6. Precedent transactions
#   7. Multiples
#   8. Equity bridge & per-share derivation
#   9. Asset-based approach
#  10. Inputs & drivers
#  11. Sensitivity & scenarios

# ─── 1. Fair value framework ───

- en: fair market value
  definition: Price at which an asset would change hands between a willing buyer and willing seller, both informed and under no compulsion
  category: dcf
  do_not_translate: false
  zh_CN: { term: 公平市场价值, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 公正市場価値, status: draft, reviewed_by: null, reviewed_on: null }

- en: fair value measurement
  definition: Accounting basis under IFRS 13 / ASC 820 for measuring assets and liabilities at fair value
  category: dcf
  do_not_translate: false
  zh_CN: { term: 公允价值计量, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 公正価値測定, status: draft, reviewed_by: null, reviewed_on: null }

- en: IFRS 13
  definition: International accounting standard governing fair value measurement
  category: dcf
  do_not_translate: true

- en: ASC 820
  definition: US GAAP codification topic governing fair value measurement
  category: dcf
  do_not_translate: true

# ─── 2. DCF mechanics ───

- en: discounted cash flow analysis
  definition: Intrinsic valuation method that discounts projected free cash flows to present value
  category: dcf
  do_not_translate: false
  zh_CN: { term: 折现现金流分析, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 割引キャッシュフロー分析, status: draft, reviewed_by: null, reviewed_on: null }

- en: DCF
  definition: Acronym for discounted cash flow
  category: dcf
  do_not_translate: true

- en: free cash flow
  definition: Operating cash flow available after reinvestment in working capital and capex
  category: dcf
  do_not_translate: false
  zh_CN: { term: 自由现金流, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: フリーキャッシュフロー, status: draft, reviewed_by: null, reviewed_on: null }

- en: free cash flow to firm
  definition: Cash flow available to all capital providers; EBIT × (1−T) + D&A − ΔNWC − capex
  category: dcf
  do_not_translate: false
  zh_CN: { term: 企业自由现金流, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 企業フリーキャッシュフロー, status: draft, reviewed_by: null, reviewed_on: null }

- en: FCFF
  definition: Acronym for free cash flow to firm
  category: dcf
  do_not_translate: true

- en: free cash flow to equity
  definition: Cash flow available to equity holders after debt service and net borrowings
  category: dcf
  do_not_translate: false
  zh_CN: { term: 股权自由现金流, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 株主フリーキャッシュフロー, status: draft, reviewed_by: null, reviewed_on: null }

- en: FCFE
  definition: Acronym for free cash flow to equity
  category: dcf
  do_not_translate: true

- en: terminal value
  definition: Value of the business beyond the explicit forecast period, capturing all cash flows in perpetuity
  category: dcf
  do_not_translate: false
  zh_CN: { term: 终值, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: ターミナルバリュー, status: draft, reviewed_by: null, reviewed_on: null }

- en: Gordon Growth Model
  definition: Terminal value method assuming cash flows grow at a constant perpetual rate
  category: dcf
  do_not_translate: false
  zh_CN: { term: 戈登增长模型, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: ゴードン成長モデル, status: draft, reviewed_by: null, reviewed_on: null }

- en: exit multiple method
  definition: Terminal value method that applies an EV/EBITDA or similar multiple to the final-year metric
  category: dcf
  do_not_translate: false
  zh_CN: { term: 退出乘数法, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 出口マルチプル法, status: draft, reviewed_by: null, reviewed_on: null }

- en: terminal growth rate
  definition: Constant perpetual growth rate applied beyond the forecast period in the Gordon Growth model
  category: dcf
  do_not_translate: false
  zh_CN: { term: 永续增长率, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 永続成長率, status: draft, reviewed_by: null, reviewed_on: null }

- en: present value
  definition: Today's value of a future cash flow, discounted at the cost of capital
  category: dcf
  do_not_translate: false
  zh_CN: { term: 现值, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 現在価値, status: draft, reviewed_by: null, reviewed_on: null }

- en: discount rate
  definition: Rate used to convert future cash flows to present value
  category: dcf
  do_not_translate: false
  zh_CN: { term: 折现率, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 割引率, status: draft, reviewed_by: null, reviewed_on: null }

- en: discount factor
  definition: Multiplicative factor 1 / (1 + WACC)^period applied to future cash flows
  category: dcf
  do_not_translate: false
  zh_CN: { term: 折现系数, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 割引係数, status: draft, reviewed_by: null, reviewed_on: null }

- en: discount period
  definition: Time index (years from valuation date) used to compute discount factor for each forecast year
  category: dcf
  do_not_translate: false
  zh_CN: { term: 折现期间, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 割引期間, status: draft, reviewed_by: null, reviewed_on: null }

- en: partial year adjustment
  definition: Mid-year or stub-period correction so the first discount period reflects the fraction of year remaining
  category: dcf
  do_not_translate: false
  zh_CN: { term: 不足年调整, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 期中調整, status: draft, reviewed_by: null, reviewed_on: null }

- en: explicit forecast period
  definition: Years for which line-by-line projections are modeled before terminal value (typically 5–10)
  category: dcf
  do_not_translate: false
  zh_CN: { term: 明确预测期, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 明示予測期間, status: draft, reviewed_by: null, reviewed_on: null }

- en: projection period
  definition: Period covered by the explicit financial forecast feeding the DCF
  category: dcf
  do_not_translate: false
  zh_CN: { term: 预测期间, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 予測期間, status: draft, reviewed_by: null, reviewed_on: null }

- en: net borrowings
  definition: Drawdowns net of repayments; flows through FCFE
  category: dcf
  do_not_translate: false
  zh_CN: { term: 净借款, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 純借入金, status: draft, reviewed_by: null, reviewed_on: null }

- en: change in working capital
  definition: Year-over-year movement in NWC; subtracted from EBIT(1−T) when computing FCFF
  category: dcf
  do_not_translate: false
  zh_CN: { term: 营运资金变动, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 運転資本の変動, status: draft, reviewed_by: null, reviewed_on: null }

- en: Damodaran ERP
  definition: Aswath Damodaran's published equity risk premium dataset by country and region
  category: dcf
  do_not_translate: false
  zh_CN: { term: Damodaran 股权风险溢价, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: ダモダランERP, status: draft, reviewed_by: null, reviewed_on: null }

- en: build-up method
  definition: Cost-of-equity construction summing risk-free rate, beta × ERP, size, country and specific risk premia
  category: dcf
  do_not_translate: false
  zh_CN: { term: 累加法, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: ビルドアップ法, status: draft, reviewed_by: null, reviewed_on: null }

# ─── 3. Cost of capital ───

- en: weighted average cost of capital
  definition: Blended cost of equity and after-tax cost of debt weighted by capital structure
  category: dcf
  do_not_translate: false
  zh_CN: { term: 加权平均资本成本, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 加重平均資本コスト, status: draft, reviewed_by: null, reviewed_on: null }

- en: WACC
  definition: Acronym for weighted average cost of capital
  category: dcf
  do_not_translate: true

- en: cost of equity
  definition: Required return on equity capital, built from risk-free rate, beta × ERP, size and specific risk premia
  category: dcf
  do_not_translate: false
  zh_CN: { term: 股权成本, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 株主資本コスト, status: draft, reviewed_by: null, reviewed_on: null }

- en: cost of debt
  definition: Yield required by debt holders before tax (pre-tax Kd) or after tax shield
  category: dcf
  do_not_translate: false
  zh_CN: { term: 债务成本, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 負債コスト, status: draft, reviewed_by: null, reviewed_on: null }

- en: pre-tax cost of debt
  definition: Yield to maturity on the company's marginal debt before applying the tax shield
  category: dcf
  do_not_translate: false
  zh_CN: { term: 税前债务成本, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 税引前負債コスト, status: draft, reviewed_by: null, reviewed_on: null }

- en: after-tax cost of debt
  definition: Pre-tax cost of debt multiplied by (1 − tax rate); reflects the interest tax shield
  category: dcf
  do_not_translate: false
  zh_CN: { term: 税后债务成本, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 税引後負債コスト, status: draft, reviewed_by: null, reviewed_on: null }

- en: risk-free rate
  definition: Yield on long-dated government securities used as the base of the cost-of-equity build
  category: dcf
  do_not_translate: false
  zh_CN: { term: 无风险利率, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: リスクフリーレート, status: draft, reviewed_by: null, reviewed_on: null }

- en: equity risk premium
  definition: Excess return demanded by equity investors over the risk-free rate
  category: dcf
  do_not_translate: false
  zh_CN: { term: 股权风险溢价, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: エクイティリスクプレミアム, status: draft, reviewed_by: null, reviewed_on: null }

- en: ERP
  definition: Acronym for equity risk premium
  category: dcf
  do_not_translate: true

- en: country risk premium
  definition: Incremental return demanded for exposure to a specific country's macro / sovereign risk
  category: dcf
  do_not_translate: false
  zh_CN: { term: 国家风险溢价, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: カントリーリスクプレミアム, status: draft, reviewed_by: null, reviewed_on: null }

- en: size premium
  definition: Additional return demanded for small-cap exposure, typically sourced from Kroll size deciles
  category: dcf
  do_not_translate: false
  zh_CN: { term: 规模溢价, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 規模プレミアム, status: draft, reviewed_by: null, reviewed_on: null }

- en: company-specific risk premium
  definition: Judgment-based add-on for idiosyncratic risks not captured by beta or other premia
  category: dcf
  do_not_translate: false
  zh_CN: { term: 公司特定风险溢价, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 企業固有リスクプレミアム, status: draft, reviewed_by: null, reviewed_on: null }

- en: Kroll size premium
  definition: Kroll-published size premium by market-cap decile, used in cost-of-equity build-up
  category: dcf
  do_not_translate: false
  zh_CN: { term: Kroll 规模溢价, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: KrollサイズプレミアムTBD, status: draft, reviewed_by: null, reviewed_on: null }  # standard rendering; confirm with reviewer

- en: beta
  definition: Sensitivity of an asset's returns to market returns; key input to the cost of equity
  category: dcf
  do_not_translate: false
  zh_CN: { term: 贝塔系数, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: ベータ, status: draft, reviewed_by: null, reviewed_on: null }

- en: levered beta
  definition: Beta reflecting the company's actual capital structure (with financial leverage)
  category: dcf
  do_not_translate: false
  zh_CN: { term: 有杠杆贝塔, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: レバードベータ, status: draft, reviewed_by: null, reviewed_on: null }

- en: unlevered beta
  definition: Beta stripped of financial leverage (asset beta)
  category: dcf
  do_not_translate: false
  zh_CN: { term: 去杠杆贝塔, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: アンレバードベータ, status: draft, reviewed_by: null, reviewed_on: null }

- en: raw beta
  definition: Regression beta as reported by data vendors before adjustment or unlevering
  category: dcf
  do_not_translate: false
  zh_CN: { term: 原始贝塔, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 生ベータ, status: draft, reviewed_by: null, reviewed_on: null }

- en: relevered beta
  definition: Unlevered beta re-leveraged at the target company's capital structure
  category: dcf
  do_not_translate: false
  zh_CN: { term: 重加杠杆贝塔, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: リレバードベータ, status: draft, reviewed_by: null, reviewed_on: null }

- en: marginal tax rate
  definition: Statutory tax rate applied to incremental earnings; used in after-tax cost of debt and FCFF
  category: dcf
  do_not_translate: false
  zh_CN: { term: 边际税率, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 限界税率, status: draft, reviewed_by: null, reviewed_on: null }

- en: effective tax rate
  definition: Actual tax expense divided by pre-tax profit; used when it persistently differs from statutory
  category: dcf
  do_not_translate: false
  zh_CN: { term: 实际税率, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 実効税率, status: draft, reviewed_by: null, reviewed_on: null }

# ─── 4. Capital structure ───

- en: capital structure
  definition: Mix of debt and equity financing the firm; D/V and E/V weights
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 资本结构, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 資本構成, status: draft, reviewed_by: null, reviewed_on: null }

- en: target capital structure
  definition: Long-run debt/equity mix used in WACC, often based on peer medians
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 目标资本结构, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 目標資本構成, status: draft, reviewed_by: null, reviewed_on: null }

- en: debt-to-equity ratio
  definition: Total debt divided by total equity; key gearing metric used in beta unlevering
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 债务股本比, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 負債資本比率, status: draft, reviewed_by: null, reviewed_on: null }

- en: debt weight
  definition: Proportion of debt in the capital structure (D/V) used in WACC
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 债务权重, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 負債ウェイト, status: draft, reviewed_by: null, reviewed_on: null }

- en: equity weight
  definition: Proportion of equity in the capital structure (E/V) used in WACC
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 股权权重, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 株式ウェイト, status: draft, reviewed_by: null, reviewed_on: null }

- en: financial leverage
  definition: Use of debt financing to amplify returns on equity
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 财务杠杆, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 財務レバレッジ, status: draft, reviewed_by: null, reviewed_on: null }

- en: tax shield
  definition: Reduction in tax expense from the deductibility of interest on debt
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 税盾, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: タックスシールド, status: draft, reviewed_by: null, reviewed_on: null }

- en: drawdown
  definition: New debt issuance under a credit facility increasing debt outstanding
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 提款, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: ドローダウン, status: draft, reviewed_by: null, reviewed_on: null }

- en: bank borrowings
  definition: Debt facilities provided by banks; carries a weighted average interest rate
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 银行借款, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 銀行借入金, status: draft, reviewed_by: null, reviewed_on: null }

- en: dividends
  definition: Cash distributions to shareholders; reduce retained earnings
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 股利, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: 配当金, status: draft, reviewed_by: null, reviewed_on: null }

- en: operating lease conversion
  definition: Damodaran adjustment that capitalizes operating lease commitments as debt-equivalent
  category: capital_structure
  do_not_translate: false
  zh_CN: { term: 经营租赁资本化调整, status: draft, reviewed_by: null, reviewed_on: null }
  ja:    { term: オペレーティングリース負債換算, status: draft, reviewed_by: null, reviewed_on: null }

