# Cross-module finance/legal/valuation terms used by 2+ of the gap/IE/DD/valuation modules.
# Loaded by translation_service.py on every translation pass. Module-specific files (gap.yaml,
# ie.yaml, dd.yaml, valuation.yaml) reference _shared first; if a term is here, do not duplicate it
# in a module file.
#
# Schema:
#   en              : canonical English form as it appears in generated reports
#   definition      : brief English gloss (for translator + reviewer reference; not rendered)
#   category        : high-level grouping
#   used_in         : modules that reference this term
#   do_not_translate: when true, the EN literal is rendered verbatim in all target languages
#                     (no zh_CN / ja blocks needed in that case)
#   zh_CN / ja      : { term, status, reviewed_by, reviewed_on }
#                     status = draft | approved | deprecated
#                     reviewed_by / reviewed_on are filled by the human reviewer at sign-off

